# 大屏 nginx 自定义配置:
# 1. 静态托管 index.html + logo.svg
# 2. /api/ 反向代理到后端 api 容器(容器网络内服务名 api)
#    => 大屏页面 API_BASE 留空走同源 /api/..., 无论用 localhost 还是局域网 IP
#       访问大屏, 请求都自动跟随当前地址, 无需因换网络改配置; 也不存在 CORS 问题
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 反向代理后端 API (同 compose 网络内的服务名 api)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
