<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="ssGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#00e676"/>
    </linearGradient>
    <linearGradient id="ssGradH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#00e676"/>
    </linearGradient>
    <filter id="ssGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 徽章底: 圆角方块 + 霓虹渐变描边 -->
  <rect x="10" y="10" width="100" height="100" rx="26"
        fill="#0a182e" stroke="url(#ssGrad)" stroke-width="3"/>

  <!-- 座位网格 2×4: 上排空闲(青) 下排占用(绿)+1空闲 -->
  <g filter="url(#ssGlow)">
    <rect x="34.5" y="28" width="9" height="9" rx="2.5" fill="#40c4ff" opacity=".9"/>
    <rect x="48.5" y="28" width="9" height="9" rx="2.5" fill="#40c4ff" opacity=".9"/>
    <rect x="62.5" y="28" width="9" height="9" rx="2.5" fill="#40c4ff" opacity=".9"/>
    <rect x="76.5" y="28" width="9" height="9" rx="2.5" fill="#40c4ff" opacity=".9"/>

    <rect x="34.5" y="42" width="9" height="9" rx="2.5" fill="#00e676"/>
    <rect x="48.5" y="42" width="9" height="9" rx="2.5" fill="#00e676"/>
    <rect x="62.5" y="42" width="9" height="9" rx="2.5" fill="#00e676"/>
    <rect x="76.5" y="42" width="9" height="9" rx="2.5" fill="#40c4ff" opacity=".9"/>
  </g>

  <!-- 实时心脉搏动线 -->
  <path d="M30 66 h12 l4 -12 7 20 5 -14 4 6 h28"
        fill="none" stroke="url(#ssGradH)" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#ssGlow)"/>
</svg>
