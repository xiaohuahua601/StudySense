<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="ssGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#00e676"/>
    </linearGradient>
    <linearGradient id="ssGradH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#00e676"/>
    </linearGradient>
    <filter id="ssGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .seat { animation: st 2.2s ease-in-out infinite; }
      @keyframes st { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .seat { animation: none; } }
    </style>
  </defs>

  <!-- 座位波纹矩阵 2×4: 上排空闲(青) 下排占用(绿)+1空闲, 依次呼吸 -->
  <g filter="url(#ssGlow)">
    <rect class="seat" x="27" y="27" width="13" height="13" rx="3" fill="#40c4ff"/>
    <rect class="seat" style="animation-delay:.35s" x="47" y="27" width="13" height="13" rx="3" fill="#40c4ff"/>
    <rect class="seat" style="animation-delay:.7s" x="67" y="27" width="13" height="13" rx="3" fill="#40c4ff"/>
    <rect class="seat" style="animation-delay:1.05s" x="87" y="27" width="13" height="13" rx="3" fill="#40c4ff"/>

    <rect class="seat" style="animation-delay:.35s" x="27" y="47" width="13" height="13" rx="3" fill="#00e676"/>
    <rect class="seat" style="animation-delay:.7s" x="47" y="47" width="13" height="13" rx="3" fill="#00e676"/>
    <rect class="seat" style="animation-delay:1.05s" x="67" y="47" width="13" height="13" rx="3" fill="#00e676"/>
    <rect class="seat" style="animation-delay:1.4s" x="87" y="47" width="13" height="13" rx="3" fill="#40c4ff"/>
  </g>

  <!-- 实时心脉搏动线 -->
  <path d="M22 78 h16 l6 -14 9 24 7 -16 5 7 h33"
        fill="none" stroke="url(#ssGradH)" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#ssGlow)"/>
</svg>
