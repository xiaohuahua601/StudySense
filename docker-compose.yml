services:
  # ---------- 后端 API + 管理门户(SSR) ----------
  api:
    build: .
    container_name: studysense-api
    ports:
      - "8000:8000"
    environment:
      TZ: Asia/Shanghai           # datetime.now() 用本地时间, 避免时间戳偏 8 小时
      MYSQL_HOST: db              # 容器网络内的 MySQL 服务名
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 里设置 MYSQL_PASSWORD}
      MYSQL_DATABASE: study_room
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      TOKEN_SECRET: ${TOKEN_SECRET:-studysense-default-secret-change-me}
      # 独立部署的仪表盘跨域白名单(来源 origin), 多个用逗号分隔
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    volumes:
      # 头像上传目录独立持久化, 重建镜像不丢用户头像
      - avatar_data:/app/web/portal_static/avatars
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ---------- 可视化大屏（nginx 纯静态, 可独立部署到班级大屏机器） ----------
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: studysense-dashboard
    ports:
      - "8080:80"
    environment:
      # API_BASE 留空 = 同源模式: nginx 将 /api/ 反向代理到 api 容器,
      # 换任何 IP/域名访问大屏都自动生效, 无需改配置
      # (保留兼容: 设为外部地址则恢复旧的直连跨域模式)
      API_BASE: ${DASHBOARD_API_BASE:-}
    depends_on:
      - api
    restart: unless-stopped

  # ---------- MySQL 数据库 ----------
  db:
    image: mysql:8.0
    container_name: studysense-db
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 里设置 MYSQL_PASSWORD}
      MYSQL_DATABASE: study_room
    ports:
      - "3307:3306"               # 宿主机 3307 避开本机已装的 MySQL 8.0(3306)
    volumes:
      - db_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---------- Ollama 大模型服务 ----------
  ollama:
    image: ollama/ollama:latest
    container_name: studysense-ollama
    ports:
      - "11435:11434"              # 宿主机 11435 → 容器 Ollama, 本地调试可直连容器内的生产模型
                                   # (宿主机 11434 被原生 Ollama 服务占用, 且两者模型目录独立)
    volumes:
      # 直接挂载宿主机模型目录, 复用本地已下载的 qwen2.5:7b-instruct-q4_K_M, 免二次下载
      - ${USERPROFILE}/.ollama:/root/.ollama
    # GPU 加速（Docker Desktop + WSL2 后端；若无法启动则删除此行回退 CPU）
    gpus: all
    restart: unless-stopped

volumes:
  db_data:
  avatar_data:
